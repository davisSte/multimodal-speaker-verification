name: rjca_audio_global_luar

model:
  family: rjca_audio_global_luar
  audio_encoder:
    type: wavlm_ecapa
    wavlm_checkpoint: /path/to/wavlm_large.pt
    freeze_wavlm: false
    backend_kwargs:
      pooling_mode: attentive_stats
  text_encoder:
    type: luar
    checkpoint_path: /path/to/luar_checkpoint.ckpt
    freeze_model: true
  embedding_dim: 192
  normalize: true
  rjca:
    audio_dim: 192
    text_dim: 512
    layers: 2
    dropout: 0.6
    lstm_layers: 2
    lstm_dropout: 0.1
  speaker_loss:
    margin: 0.2
    scale: 30.0

data:
  manifest: /path/to/train_audio_text_manifest.txt
  sample_rate: 16000
  segment_seconds: 4.0
  speakers_per_batch: 64
  utterances_per_speaker: 5

training:
  epochs: 5
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 0.0
  grad_clip: 1.0

output_dir: /path/to/output/rjca_audio_global_luar
