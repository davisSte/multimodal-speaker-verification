name: audio_only_mean_pool

model:
  family: mean_pooled_audio
  audio_encoder:
    type: wavlm_ecapa
    wavlm_checkpoint: /path/to/wavlm_large.pt
    freeze_wavlm: true
    backend_kwargs:
      pooling_mode: attentive_stats
  embedding_dim: 192
  normalize: true
  speaker_loss:
    margin: 0.2
    scale: 30.0

data:
  manifest: /path/to/train_audio_manifest.txt
  sample_rate: 16000
  segment_seconds: 4.0
  speakers_per_batch: 64
  utterances_per_speaker: 5

training:
  epochs: 30
  batch_size: 64
  learning_rate: 5e-4
  weight_decay: 1e-4
  grad_clip: 1.0

output_dir: /path/to/output/audio_only_mean_pool
