[project]
name = "streamvoiceanon"
version = "0.1.0"
description = "Environment definition for StreamVoiceAnon"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "accelerate",
  "torch==2.4.0",
  "torchvision==0.19.0",
  "torchaudio==2.4.0",
  "scipy==1.13.1",
  "librosa==0.10.2",
  "huggingface-hub>=0.28.1",
  "munch==4.0.0",
  "einops==0.8.0",
  "descript-audio-codec==1.0.0",
  "pydub==0.25.1",
  "transformers==4.46.3",
  "FreeSimpleGUI==5.1.1",
  "soundfile==0.12.1",
  "sounddevice==0.5.0",
  "modelscope==1.18.1",
  "funasr==1.1.5",
  "numpy==1.26.4",
  "hydra-core==1.3.2",
  "pyyaml",
  "python-dotenv",
  "vector-quantize-pytorch",
]

[project.optional-dependencies]
anon = [
  "matplotlib==3.4.3",
  "tensorboard>=2.15.1",
  "soundfile==0.12.1",
  "ffmpeg>=1.4",
  "tqdm",
  "pyarrow>=15.0.0",
  "pandas>=2.2.0",
  "numba",
  "speechbrain==0.5.16",
  "pyloudnorm>=0.1.1",
  "kaldiio>=2.18.0",
  "noisereduce==3.0.0",
]

[tool.uv]
package = false
